<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravity ZERO 回数券発行</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-title" content="G-ZERO 回数券">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#faf0e6">
  <style>
    :root {
      color-scheme: light;
      --bg: #faf0e6;
      --panel: #161b26;
      --accent: #4fd1ff;
      --text: #e8edf4;
      --text-dim: #8a93a3;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }
    h1 {
      font-size: 18px;
      letter-spacing: 0.06em;
      color: #4169e1;
      margin: 8px 0 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #F067A6;
      background: #ffffff;
      color: #000000;
      font-size: 15px;
      margin-bottom: 18px;
    }
    input::placeholder {
      color: #bbbbbb;
    }
    button.issue {
      width: 100%;
      padding: 14px 0;
      border-radius: 12px;
      border: none;
      background: #F067A6;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.issue:disabled {
      background: #ffffff;
      color: #4169e1;
      cursor: not-allowed;
    }
    .error {
      color: var(--danger);
      font-weight: 700;
      -webkit-text-stroke: 0.4px currentColor;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 14px;
      min-height: 1em;
    }
    .success {
      color: #2f7d4f;
      font-weight: 700;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 14px;
      min-height: 1em;
    }
    .bonus-card {
      margin-top: 16px;
    }
    .bonus-card h2 {
      font-size: 15px;
      color: #000000;
      margin: 0 0 14px;
    }
    button.grant-bonus {
      width: 100%;
      padding: 14px 0;
      border-radius: 12px;
      border: none;
      background: #d4af00;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.grant-bonus:disabled {
      background: #ffffff;
      color: #4169e1;
      cursor: not-allowed;
    }
    button.grant-coupon {
      width: 100%;
      padding: 14px 0;
      border-radius: 12px;
      border: none;
      background: #4fd1ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.grant-coupon:disabled {
      background: #ffffff;
      color: #4169e1;
      cursor: not-allowed;
    }
    button.lookup-search {
      width: 100%;
      padding: 14px 0;
      border-radius: 12px;
      border: none;
      background: #6c5ce7;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.lookup-search:disabled {
      background: #ffffff;
      color: #4169e1;
      cursor: not-allowed;
    }
    .lookup-item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      text-align: left;
    }
    .lookup-item .qr-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lookup-item .qr-row img {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      background: #fff;
      padding: 6px;
      flex-shrink: 0;
    }
    .lookup-item dl {
      font-size: 13px;
      margin: 0;
    }
    .lookup-item dt { color: #000000; font-weight: 700; margin-top: 6px; }
    .lookup-item dd { margin: 2px 0 0; font-weight: 600; color: #F067A6; }
    .lookup-item .url {
      word-break: break-all;
      font-size: 11px;
      color: var(--text-dim);
      background: #0f131c;
      border-radius: 8px;
      padding: 8px;
      margin-top: 10px;
    }
    button.copy-url {
      margin-top: 8px;
      width: 100%;
      padding: 10px 0;
      border-radius: 10px;
      border: none;
      background: #4fd1ff;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .result {
      display: none;
      text-align: center;
    }
    .result.show { display: block; }
    .result .qr {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      display: inline-block;
      margin: 12px 0;
    }
    .result .qr img { display: block; width: 200px; height: 200px; }
    .result dl {
      text-align: left;
      font-size: 14px;
      margin: 16px 0;
    }
    .result dt { color: #000000; font-weight: 700; margin-top: 8px; }
    .result dd { margin: 2px 0 0; font-weight: 600; color: #F067A6; }
    .result .url {
      word-break: break-all;
      font-size: 12px;
      color: var(--text-dim);
      background: #0f131c;
      border-radius: 8px;
      padding: 10px;
    }
    button.again {
      width: 100%;
      padding: 14px 0;
      border-radius: 12px;
      border: none;
      background: #F067A6;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      margin-top: 16px;
      cursor: pointer;
    }
    /* PC等の横幅が確保できる画面では回数券/従量制パスを2カラムで横並びにし、
       スマホ等の狭い画面ではauto-fitにより自動的に1カラムへ戻る
       (grid-template-columnsの各トラックがminmax(360px, 1fr)を満たせなくなった
       時点で折り返される)。 */
    .product-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 8px 32px;
      align-items: start;
    }
    .product-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 28px;
      border-radius: 24px;
    }
    .product-column.tickets {
      background: #ffb3d6;
    }
    .product-column.pass {
      background: #9fe3bf;
    }
    .product-heading {
      width: 100%;
      max-width: 420px;
      margin: 0 0 18px;
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    .product-heading.tickets {
      color: #d6337e;
    }
    .product-heading.pass {
      color: #1f7a4d;
    }
    .amount-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 6px;
    }
    button.amount-option {
      padding: 12px 4px;
      border-radius: 10px;
      border: 2px solid #2f9e6b;
      background: #ffffff;
      color: #2f9e6b;
      cursor: pointer;
      line-height: 1.3;
    }
    button.amount-option .amount-yen {
      display: block;
      font-size: 15px;
      font-weight: 800;
    }
    button.amount-option .amount-hours {
      display: block;
      font-size: 12px;
      font-weight: 600;
    }
    button.amount-option.selected {
      background: #2f9e6b;
      color: #ffffff;
    }
    .amount-hint {
      font-size: 12px;
      color: #666666;
      margin: 0 0 18px;
      text-align: center;
    }
    button.charge-pass {
      width: 100%;
      padding: 14px 0;
      border-radius: 12px;
      border: none;
      background: #2f9e6b;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.charge-pass:disabled {
      background: #ffffff;
      color: #4169e1;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>GRAVITY ZERO スタッフ用管理画面</h1>

  <div class="product-grid">
    <div class="product-column tickets">
      <div class="product-heading tickets">🎫 回数券</div>

      <div class="card">
        <div id="form-view">
          <label for="purchaser-name">購入者名</label>
          <input id="purchaser-name" type="text" placeholder="重力無太郎">

          <label for="purchaser-phone">生年月日(任意)</label>
          <input id="purchaser-phone" type="text" placeholder="yyyy/mm/dd">

          <div class="error" id="form-error"></div>

          <button class="issue" id="issue-button">発行する</button>
        </div>

        <div class="result" id="result-view">
          <div style="text-align:center">
            <div class="qr"><img id="qr-image" alt="QRコード"></div>
          </div>
          <dl>
            <dt>【購入者名】</dt><dd id="result-name"></dd>
            <dt>【TicketID】</dt><dd id="result-id"></dd>
            <dt>【回数 / 有効期限】</dt><dd id="result-count-expiry"></dd>
          </dl>
          <div class="url" id="result-url"></div>
          <button class="again" id="issue-again">続けて発行する</button>
        </div>
      </div>

      <div class="card bonus-card">
        <h2>🎁 グラゼロ・アタック達成 特典付与</h2>
        <label for="bonus-purchaser-name">購入者名(ひらがな)</label>
        <input id="bonus-purchaser-name" type="text" placeholder="例: じゅうりょくむたろう">
        <div class="error" id="bonus-message"></div>
        <button class="grant-bonus" id="bonus-button">🎁 特典を付与する</button>
      </div>

      <div class="card bonus-card">
        <h2>🎫 次回来店、30分無料クーポン付与</h2>
        <label for="coupon-purchaser-name">購入者名(ひらがな)</label>
        <input id="coupon-purchaser-name" type="text" placeholder="例: じゅうりょくむたろう">
        <div class="error" id="coupon-message"></div>
        <button class="grant-coupon" id="coupon-button">🎫 クーポンを付与する</button>
      </div>

      <div class="card bonus-card">
        <h2>🔍 URL再案内(ホーム画面アイコン消失・URL紛失時)</h2>
        <label for="lookup-purchaser-name">購入者名</label>
        <input id="lookup-purchaser-name" type="text" placeholder="例: 重力無太郎">
        <label for="lookup-purchaser-birthday">生年月日(任意・同姓同名の絞り込み用)</label>
        <input id="lookup-purchaser-birthday" type="text" placeholder="yyyy/mm/dd">
        <div class="error" id="lookup-message"></div>
        <button class="lookup-search" id="lookup-button">🔍 検索する</button>
        <div id="lookup-results"></div>
      </div>
    </div>

    <div class="product-column pass">
      <div class="product-heading pass">💰 従量制パス</div>

      <div class="card">
        <div id="pass-issue-form-view">
          <label for="pass-purchaser-name">購入者名</label>
          <input id="pass-purchaser-name" type="text" placeholder="重力無太郎">

          <label for="pass-purchaser-birthday">生年月日(任意)</label>
          <input id="pass-purchaser-birthday" type="text" placeholder="yyyy/mm/dd">

          <label>初回チャージ額</label>
          <div class="amount-grid" id="pass-amount-grid"></div>
          <div class="amount-hint">15分＝400円　60分＝1,600円</div>

          <label for="pass-issue-custom-amount">それ以上の金額(任意・400円単位)</label>
          <input id="pass-issue-custom-amount" type="number" step="400" min="3200" placeholder="例: 8000">

          <div class="error" id="pass-issue-error"></div>

          <button class="issue" id="pass-issue-button">パスを発行する</button>
        </div>

        <div class="result" id="pass-issue-result-view">
          <div style="text-align:center">
            <div class="qr"><img id="pass-qr-image" alt="QRコード"></div>
          </div>
          <dl>
            <dt>【購入者名】</dt><dd id="pass-result-name"></dd>
            <dt>【PassID】</dt><dd id="pass-result-id"></dd>
            <dt>【初回チャージ額】</dt><dd id="pass-result-amount"></dd>
          </dl>
          <div class="url" id="pass-result-url"></div>
          <button class="again" id="pass-issue-again">続けて発行する</button>
        </div>
      </div>

      <div class="card bonus-card">
        <h2>💳 従量制パス 追加チャージ</h2>
        <label for="pass-charge-name">購入者名</label>
        <input id="pass-charge-name" type="text" placeholder="例: 重力無太郎">
        <label for="pass-charge-amount">チャージ額(円・1,600円単位、上限なし)</label>
        <input id="pass-charge-amount" type="number" step="1600" min="1600" placeholder="例: 1600">
        <div class="amount-hint">15分＝400円　60分＝1,600円</div>
        <div class="error" id="pass-charge-message"></div>
        <button class="charge-pass" id="pass-charge-button">💳 チャージする</button>
      </div>

      <div class="card bonus-card">
        <h2>⚡ グラゼロ・アタック達成 特典付与(従量制パス)</h2>
        <label for="pass-bonus-purchaser-name">購入者名</label>
        <input id="pass-bonus-purchaser-name" type="text" placeholder="例: 重力無太郎">
        <div class="error" id="pass-bonus-message"></div>
        <button class="grant-bonus" id="pass-bonus-button">🎁 特典を付与する</button>
      </div>
    </div>
  </div>

  <script>
    var API_BASE = 'https://script.google.com/macros/s/AKfycbx22R7ugfVC9Yl_HR0_Z_6lNIv1-AFQ5Y7qooSPtBQhkm93nnArRtL15ohoOTWbdUNa/exec';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    }

    function $(id) { return document.getElementById(id); }

    function generateRequestId_() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    }

    /**
     * action=issue/consumeのように副作用(発行・消化)を伴う呼び出しは
     * idempotent: true を指定すること。呼び出しごとに変わるrid(リクエストID)を
     * 付与し、レスポンスのJSONパースに失敗した場合サーバー側は同じridの結果を
     * 再実行せずそのまま返す(digital-kaisuuken側のwithIdempotency_と対応)ので、
     * 安全に自動リトライできる。
     */
    function apiCall(action, params, opts) {
      opts = opts || {};
      var rid = opts.idempotent ? generateRequestId_() : null;
      var maxAttempts = 3;

      function attempt(attemptsLeft) {
        var url = new URL(API_BASE);
        url.searchParams.set('action', action);
        Object.keys(params || {}).forEach(function (key) {
          url.searchParams.set(key, params[key]);
        });
        if (rid) url.searchParams.set('rid', rid);
        // iOS Safari等がGETリクエストを強くキャッシュし、サーバー側の一時的な
        // 不具合や再デプロイ前の古い応答をいつまでも再送してしまう問題への対策。
        // 呼び出しごとに変わるパラメータを付与してURLを一意にし、
        // cache: 'no-store' でHTTPキャッシュそのものを使わせない。
        url.searchParams.set('_', Date.now().toString() + '-' + Math.random().toString(36).slice(2));

        return fetch(url.toString(), { cache: 'no-store' })
          .then(function (res) { return res.text(); })
          .then(function (text) {
            var data;
            try {
              data = JSON.parse(text);
            } catch (parseError) {
              // まれにサーバーからの応答がJSON以外(HTML等)になることがある。
              // rid付き(idempotent)呼び出しなら、サーバー側で処理が二重実行
              // されない保証があるため安全にリトライできる。
              if (attemptsLeft > 1) {
                return new Promise(function (resolve) {
                  setTimeout(function () { resolve(attempt(attemptsLeft - 1)); }, 800);
                });
              }
              throw new Error('サーバーとの通信に失敗しました。電波の良い場所で少し待ってから、もう一度お試しください。');
            }
            if (data && data.error) throw new Error(data.error);
            return data;
          });
      }

      return attempt(maxAttempts);
    }

    function formatDate(isoString) {
      var d = new Date(isoString);
      return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
    }

    function showResult(ticket) {
      $('form-view').style.display = 'none';
      $('result-view').className = 'result show';
      $('qr-image').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(ticket.ticketUrl);
      $('result-name').textContent = ticket.purchaserName + ' 様';
      $('result-id').textContent = ticket.ticketId;
      $('result-count-expiry').textContent = ticket.totalCount + '回 / ' + formatDate(ticket.expiryDate) + 'まで';
      $('result-url').textContent = ticket.ticketUrl;
    }

    function resetForm() {
      $('purchaser-name').value = '';
      $('purchaser-phone').value = '';
      $('form-error').textContent = '';
      $('result-view').className = 'result';
      $('form-view').style.display = 'block';
      $('issue-button').disabled = false;
      $('issue-button').textContent = '発行する';
    }

    $('issue-button').addEventListener('click', function () {
      var name = $('purchaser-name').value.trim();
      var phone = $('purchaser-phone').value.trim();
      $('form-error').textContent = '';

      if (!name) {
        $('form-error').textContent = '購入者名を入力してください。';
        return;
      }

      $('issue-button').disabled = true;
      $('issue-button').textContent = '発行中...';

      apiCall('issue', { name: name, phone: phone }, { idempotent: true })
        .then(function (ticket) {
          showResult(ticket);
        })
        .catch(function (error) {
          $('form-error').textContent = error.message;
          $('issue-button').disabled = false;
          $('issue-button').textContent = '発行する';
        });
    });

    $('issue-again').addEventListener('click', resetForm);

    function setBonusMessage(text, isError) {
      var el = $('bonus-message');
      el.className = isError ? 'error' : 'success';
      el.textContent = text;
    }

    $('bonus-button').addEventListener('click', function () {
      var purchaserName = $('bonus-purchaser-name').value.trim();
      setBonusMessage('', false);

      if (!purchaserName) {
        setBonusMessage('購入者名を入力してください。', true);
        return;
      }

      $('bonus-button').disabled = true;
      $('bonus-button').textContent = '処理中...';

      apiCall('grantBonus', { name: purchaserName })
        .then(function (result) {
          $('bonus-button').disabled = false;
          $('bonus-button').textContent = '🎁 特典を付与する';
          if (result.alreadyGranted) {
            setBonusMessage(result.purchaserName + '様は既に特典付与済みです。', false);
          } else {
            setBonusMessage(result.purchaserName + '様への特典付与が完了しました。', false);
            $('bonus-purchaser-name').value = '';
          }
        })
        .catch(function (error) {
          $('bonus-button').disabled = false;
          $('bonus-button').textContent = '🎁 特典を付与する';
          setBonusMessage(error.message, true);
        });
    });

    function setCouponMessage(text, isError) {
      var el = $('coupon-message');
      el.className = isError ? 'error' : 'success';
      el.textContent = text;
    }

    $('coupon-button').addEventListener('click', function () {
      var purchaserName = $('coupon-purchaser-name').value.trim();
      setCouponMessage('', false);

      if (!purchaserName) {
        setCouponMessage('購入者名を入力してください。', true);
        return;
      }

      $('coupon-button').disabled = true;
      $('coupon-button').textContent = '処理中...';

      apiCall('grantCompletionCoupon', { name: purchaserName })
        .then(function (result) {
          $('coupon-button').disabled = false;
          $('coupon-button').textContent = '🎫 クーポンを付与する';
          if (result.alreadyGranted) {
            setCouponMessage(result.purchaserName + '様は既にクーポン付与済みです。', false);
          } else {
            setCouponMessage(result.purchaserName + '様へのクーポン付与が完了しました。', false);
            $('coupon-purchaser-name').value = '';
          }
        })
        .catch(function (error) {
          $('coupon-button').disabled = false;
          $('coupon-button').textContent = '🎫 クーポンを付与する';
          setCouponMessage(error.message, true);
        });
    });

    function statusLabel(status) {
      switch (status) {
        case 'active': return '利用中';
        case 'completed': return '完走済み';
        case 'expired': return '期限切れ';
        default: return status;
      }
    }

    function setLookupMessage(text, isError) {
      var el = $('lookup-message');
      el.className = isError ? 'error' : 'success';
      el.textContent = text;
    }

    function renderLookupResults(tickets) {
      var container = $('lookup-results');
      container.innerHTML = '';

      tickets.forEach(function (ticket) {
        var item = document.createElement('div');
        item.className = 'lookup-item';

        var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(ticket.ticketUrl);

        item.innerHTML =
          '<div class="qr-row">' +
            '<img src="' + qrUrl + '" alt="QRコード">' +
            '<dl>' +
              '<dt>【購入者名】</dt><dd>' + ticket.purchaserName + ' 様</dd>' +
              '<dt>【TicketID】</dt><dd>' + ticket.ticketId + '</dd>' +
              '<dt>【状態】</dt><dd>' + statusLabel(ticket.status) + '(残' + ticket.remainingCount + '/' + ticket.totalCount + '回)</dd>' +
              '<dt>【有効期限】</dt><dd>' + formatDate(ticket.expiryDate) + 'まで</dd>' +
            '</dl>' +
          '</div>' +
          '<div class="url">' + ticket.ticketUrl + '</div>' +
          '<button class="copy-url" type="button">URLをコピー</button>';

        var copyButton = item.querySelector('.copy-url');
        copyButton.addEventListener('click', function () {
          navigator.clipboard.writeText(ticket.ticketUrl).then(function () {
            var original = copyButton.textContent;
            copyButton.textContent = 'コピーしました';
            setTimeout(function () { copyButton.textContent = original; }, 1500);
          });
        });

        container.appendChild(item);
      });
    }

    $('lookup-button').addEventListener('click', function () {
      var name = $('lookup-purchaser-name').value.trim();
      var birthday = $('lookup-purchaser-birthday').value.trim();
      setLookupMessage('', false);
      $('lookup-results').innerHTML = '';

      if (!name) {
        setLookupMessage('購入者名を入力してください。', true);
        return;
      }

      $('lookup-button').disabled = true;
      $('lookup-button').textContent = '検索中...';

      apiCall('lookup', { name: name, birthday: birthday })
        .then(function (result) {
          $('lookup-button').disabled = false;
          $('lookup-button').textContent = '🔍 検索する';
          renderLookupResults(result.tickets);
        })
        .catch(function (error) {
          $('lookup-button').disabled = false;
          $('lookup-button').textContent = '🔍 検索する';
          setLookupMessage(error.message, true);
        });
    });

    // ---- 従量制パス(usage-based-pass-spec.md参照) ----

    // 選択肢が多すぎるとお客さんが迷うため、松竹梅の3段階をボタンで提示し、
    // それ以上の金額が欲しい場合は下の「それ以上の金額」欄に直接入力できる
    // ようにする(バックエンドのissuePass自体は3,200円以上・1,600円単位で
    // あれば上限なく受け付ける。2026-09-11変更)。
    var PASS_INITIAL_CHARGE_AMOUNTS = [3200, 4800, 6400];
    // 消費レート(15分400円)より、1,600円 = 1時間で固定的に換算できる。
    var PASS_YEN_PER_HOUR = 1600;
    var selectedInitialChargeAmount = null;

    function renderPassAmountGrid() {
      var grid = $('pass-amount-grid');
      grid.innerHTML = '';
      PASS_INITIAL_CHARGE_AMOUNTS.forEach(function (amount) {
        var hours = amount / PASS_YEN_PER_HOUR;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'amount-option';
        btn.innerHTML = '<span class="amount-yen">' + amount.toLocaleString() + '円</span><span class="amount-hours">' + hours + '時間分</span>';
        btn.addEventListener('click', function () {
          selectedInitialChargeAmount = amount;
          $('pass-issue-custom-amount').value = '';
          Array.prototype.forEach.call(grid.querySelectorAll('.amount-option'), function (b) {
            b.classList.remove('selected');
          });
          btn.classList.add('selected');
        });
        grid.appendChild(btn);
      });
    }
    renderPassAmountGrid();

    // 「それ以上の金額」欄に入力があれば、プリセットボタンの選択を解除する
    // (どちらが使われるか分かりやすくするため)。
    $('pass-issue-custom-amount').addEventListener('input', function () {
      if ($('pass-issue-custom-amount').value.trim() === '') return;
      selectedInitialChargeAmount = null;
      Array.prototype.forEach.call($('pass-amount-grid').querySelectorAll('.amount-option'), function (b) {
        b.classList.remove('selected');
      });
    });

    function showPassIssueResult(pass) {
      $('pass-issue-form-view').style.display = 'none';
      $('pass-issue-result-view').className = 'result show';
      $('pass-qr-image').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(pass.passUrl);
      $('pass-result-name').textContent = pass.purchaserName + ' 様';
      $('pass-result-id').textContent = pass.passId;
      $('pass-result-amount').textContent = Number(pass.remainingAmount).toLocaleString() + '円';
      $('pass-result-url').textContent = pass.passUrl;
    }

    function resetPassIssueForm() {
      $('pass-purchaser-name').value = '';
      $('pass-purchaser-birthday').value = '';
      $('pass-issue-custom-amount').value = '';
      $('pass-issue-error').textContent = '';
      selectedInitialChargeAmount = null;
      renderPassAmountGrid();
      $('pass-issue-result-view').className = 'result';
      $('pass-issue-form-view').style.display = 'block';
      $('pass-issue-button').disabled = false;
      $('pass-issue-button').textContent = 'パスを発行する';
    }

    $('pass-issue-button').addEventListener('click', function () {
      var name = $('pass-purchaser-name').value.trim();
      var birthday = $('pass-purchaser-birthday').value.trim();
      var customAmount = Number($('pass-issue-custom-amount').value);
      var amount = customAmount || selectedInitialChargeAmount;
      $('pass-issue-error').textContent = '';

      if (!name) {
        $('pass-issue-error').textContent = '購入者名を入力してください。';
        return;
      }
      if (!amount) {
        $('pass-issue-error').textContent = '初回チャージ額を選択するか、それ以上の金額を入力してください。';
        return;
      }

      $('pass-issue-button').disabled = true;
      $('pass-issue-button').textContent = '発行中...';

      apiCall('issuePass', { name: name, birthday: birthday, amount: amount }, { idempotent: true })
        .then(function (pass) {
          showPassIssueResult(pass);
        })
        .catch(function (error) {
          $('pass-issue-error').textContent = error.message;
          $('pass-issue-button').disabled = false;
          $('pass-issue-button').textContent = 'パスを発行する';
        });
    });

    $('pass-issue-again').addEventListener('click', resetPassIssueForm);

    function setPassChargeMessage(text, isError) {
      var el = $('pass-charge-message');
      el.className = isError ? 'error' : 'success';
      el.textContent = text;
    }

    $('pass-charge-button').addEventListener('click', function () {
      var name = $('pass-charge-name').value.trim();
      var amount = Number($('pass-charge-amount').value);
      setPassChargeMessage('', false);

      if (!name) {
        setPassChargeMessage('購入者名を入力してください。', true);
        return;
      }
      if (!amount) {
        setPassChargeMessage('チャージ額を入力してください。', true);
        return;
      }

      $('pass-charge-button').disabled = true;
      $('pass-charge-button').textContent = '処理中...';

      apiCall('chargePassByName', { name: name, amount: amount }, { idempotent: true })
        .then(function (result) {
          $('pass-charge-button').disabled = false;
          $('pass-charge-button').textContent = '💳 チャージする';
          setPassChargeMessage(
            name + '様に' + amount.toLocaleString() + '円チャージしました(残高: ' + Number(result.remainingAmount).toLocaleString() + '円)。',
            false
          );
          $('pass-charge-amount').value = '';
        })
        .catch(function (error) {
          $('pass-charge-button').disabled = false;
          $('pass-charge-button').textContent = '💳 チャージする';
          setPassChargeMessage(error.message, true);
        });
    });

    function setPassBonusMessage(text, isError) {
      var el = $('pass-bonus-message');
      el.className = isError ? 'error' : 'success';
      el.textContent = text;
    }

    $('pass-bonus-button').addEventListener('click', function () {
      var purchaserName = $('pass-bonus-purchaser-name').value.trim();
      setPassBonusMessage('', false);

      if (!purchaserName) {
        setPassBonusMessage('購入者名を入力してください。', true);
        return;
      }

      $('pass-bonus-button').disabled = true;
      $('pass-bonus-button').textContent = '処理中...';

      apiCall('grantSpeedClearBonus', { name: purchaserName })
        .then(function (result) {
          $('pass-bonus-button').disabled = false;
          $('pass-bonus-button').textContent = '🎁 特典を付与する';
          if (result.alreadyGranted) {
            setPassBonusMessage(result.purchaserName + '様は既に特典付与済みです。', false);
          } else {
            setPassBonusMessage(result.purchaserName + '様への特典付与が完了しました。', false);
            $('pass-bonus-purchaser-name').value = '';
          }
        })
        .catch(function (error) {
          $('pass-bonus-button').disabled = false;
          $('pass-bonus-button').textContent = '🎁 特典を付与する';
          setPassBonusMessage(error.message, true);
        });
    });
  </script>
</body>
</html>
